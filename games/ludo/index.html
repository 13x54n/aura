<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ludo · Free Play</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="meta" id="status">Free Play · your house is bottom-left · roll to start</div>
    <div class="board-stage" id="boardStage">
      <canvas id="board-canvas" width="375" height="375"></canvas>

      <!-- Screen corners after VIEW_ROT=3: TL=Green2 TR=Blue0 BR=Yellow1 BL=Red3 -->
      <div class="seat seat-tl" data-seat="2" data-corner="tl">
        <div class="identity">
          <div class="avatar" style="--seat:#16A34A">G</div>
          <div class="nameplate"><span class="name">Green</span></div>
        </div>
        <div class="dock">
          <div class="dock-row">
            <button type="button" class="seat-die-btn" disabled aria-label="Roll dice">
              <canvas class="seat-dice" width="48" height="48"></canvas>
              <span class="die-timer" hidden></span>
            </button>
          </div>
        </div>
      </div>
      <div class="seat seat-tr" data-seat="0" data-corner="tr">
        <div class="identity">
          <div class="avatar" style="--seat:#2563EB">B</div>
          <div class="nameplate"><span class="name">Blue</span></div>
        </div>
        <div class="dock">
          <div class="dock-row">
            <button type="button" class="seat-die-btn" disabled aria-label="Roll dice">
              <canvas class="seat-dice" width="48" height="48"></canvas>
              <span class="die-timer" hidden></span>
            </button>
          </div>
        </div>
      </div>
      <div class="seat seat-br" data-seat="1" data-corner="br">
        <div class="identity">
          <div class="avatar" style="--seat:#EAB308">Y</div>
          <div class="nameplate"><span class="name">Yellow</span></div>
        </div>
        <div class="dock">
          <div class="dock-row">
            <button type="button" class="seat-die-btn" disabled aria-label="Roll dice">
              <canvas class="seat-dice" width="48" height="48"></canvas>
              <span class="die-timer" hidden></span>
            </button>
          </div>
        </div>
      </div>
      <div class="seat seat-bl you" data-seat="3" data-corner="bl">
        <div class="identity">
          <div class="avatar" style="--seat:#DC2626">You</div>
          <div class="nameplate"><span class="name">Red</span></div>
        </div>
        <div class="dock">
          <div class="dock-row">
            <button type="button" class="seat-die-btn" disabled aria-label="Roll dice">
              <canvas class="seat-dice" width="48" height="48"></canvas>
              <span class="die-timer" hidden></span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="row">
      <button type="button" id="closeBtn" class="ghost">Close</button>
    </div>
    <div class="hint">Active corner glows · tap the die · Six: yard → start</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
