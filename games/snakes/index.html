<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Snakes &amp; Ladders · Free Play</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <div class="meta" id="status">Free Play · you are Purple · roll to start</div>
    <canvas id="board" width="400" height="400"></canvas>
    <div class="row">
      <canvas id="dice" width="56" height="56"></canvas>
      <button type="button" id="rollBtn">Roll</button>
      <button type="button" id="closeBtn" class="ghost">Close</button>
    </div>
    <div class="hint">Snakes slide down · ladders climb up · exact 100 to win. Green is the bot.</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
